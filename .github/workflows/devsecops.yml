name: DevSecOps Pipeline

# Gatilhos automáticos: todo push, todo Pull Request e execução manual.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: app:ci
  # Security Gate: severidades que reprovam a esteira
  GATE_SEVERITY: HIGH,CRITICAL

jobs:
  # ---------------------------------------------------------------- 1
  secret-scanning:
    name: 1 · Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks (reprova se achar segredo)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            dir /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1

  # ---------------------------------------------------------------- 2
  sast:
    name: 2 · SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install semgrep==1.186.0
      - name: Semgrep (regras do projeto + registry p/python)
        run: |
          semgrep scan \
            --config .semgrep/rules.yml \
            --config p/python \
            --severity ERROR \
            --error \
            --metrics=off \
            app

  # ---------------------------------------------------------------- 3
  sca-sbom:
    name: 3 · SCA + SBOM (Trivy / CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gera o SBOM (CycloneDX)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.58.0 fs \
            --format cyclonedx --output /src/sbom.cdx.json /src/requirements.txt
      - name: Publica o SBOM como artefato
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
      - name: SCA - CVEs nas dependências (reprova em HIGH/CRITICAL)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.58.0 fs \
            --scanners vuln --severity "$GATE_SEVERITY" --ignore-unfixed \
            --exit-code 1 /src/requirements.txt

  # ---------------------------------------------------------------- 4
  docker-iac:
    name: 4 · Docker + IaC (Hadolint / Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Hadolint - boas práticas e USER root no Dockerfile
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 \
            hadolint --failure-threshold warning - < Dockerfile
      - name: Checkov - Dockerfile e manifestos Kubernetes
        run: |
          pip install checkov==3.1.47
          # CKV_K8S_43 (image por digest) dispensado: a tag é imutável por SHA no deploy
          checkov -d . --framework dockerfile,kubernetes \
            --skip-check CKV_K8S_43 --compact

  # ---------------------------------------------------------------- 5
  tests:
    name: 5 · Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  # ---------------------------------------------------------------- 6
  image-scan:
    name: 6 · Build + Scan da imagem (Trivy)
    runs-on: ubuntu-latest
    needs: [secret-scanning, sast, sca-sbom, docker-iac, tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t "$IMAGE_NAME" .
      - name: Trivy image (reprova em CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.0 image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE_NAME"
      - name: Confirma que o contêiner não roda como root
        run: |
          uid=$(docker run --rm --entrypoint id "$IMAGE_NAME" -u)
          echo "UID do processo: $uid"
          test "$uid" != "0"

  # ---------------------------------------------------------------- 7
  dast:
    name: 7 · DAST (testes HTTP + OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [image-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Sobe a API em ambiente efêmero
        run: |
          docker build -t "$IMAGE_NAME" .
          docker run -d --name api --network host --read-only \
            --cap-drop ALL --security-opt no-new-privileges "$IMAGE_NAME"
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/health && break
            sleep 1
          done
      - name: DAST - cabeçalhos, validação, CORS (scripts/dast_check.py)
        run: python3 scripts/dast_check.py http://127.0.0.1:8000
      - name: DAST - OWASP ZAP (API scan via OpenAPI)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
            -t http://127.0.0.1:8000/openapi.json -f openapi \
            -r zap-report.html -I
      - name: Publica relatório do ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap/zap-report.html
          if-no-files-found: ignore
      - name: Logs do contêiner
        if: failure()
        run: docker logs api

  # ---------------------------------------------------------------- 8
  deploy:
    name: 8 · Deploy (publica imagem no GHCR)
    runs-on: ubuntu-latest
    needs: [dast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login no GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build e push (tag = SHA do commit)
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -t "$REPO:${GITHUB_SHA}" .
          docker push "$REPO:${GITHUB_SHA}"
          echo "Imagem publicada: $REPO:${GITHUB_SHA}"
      - name: Publica manifestos Kubernetes validados
        uses: actions/upload-artifact@v4
        with:
          name: k8s-manifests
          path: k8s/
